services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tablero
      POSTGRES_PASSWORD: tablero_dev_pw
      POSTGRES_DB: tablero
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablero"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      TABLERO_DATABASE_URL: postgresql+psycopg2://tablero:tablero_dev_pw@db:5432/tablero
      TABLERO_JWT_SECRET: dev-secret-change-me
      TABLERO_ENVIRONMENT: development
      TABLERO_FRONTEND_ORIGIN: http://localhost:5180
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "5180:80"
    depends_on:
      - backend

volumes:
  pgdata:
