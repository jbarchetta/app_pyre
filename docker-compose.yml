services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tablero
      POSTGRES_PASSWORD: tablero_dev_pw
      POSTGRES_DB: tablero
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablero"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
